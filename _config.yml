title: ChartHorizon
tagline: The Weekly Tape
description: >-
  Weekly futures positioning notes from the CFTC Commitments of Traders report —
  where season, producer positioning, hedging program and term structure line up.
  Data: ChartHorizon.
url: https://chart-horizon.com
baseurl: ""
author: ChartHorizon

# Default social-share image (Open Graph / Twitter). 1.91:1 (1200×630) is ideal.
# Per-post `image:` front matter overrides this; replace the file to rebrand without touching config.
og_image: /assets/og-default.png

markdown: kramdown

# Stylesheet cache key, appended as ?v= in _layouts/default.html. BUMP THIS whenever
# assets/css/blog.css changes — otherwise returning readers keep the cached copy.
# (It used to be site.time, which made every daily FX push re-download the CSS.)
css_version: 11

# The desk's timezone. Without this, CI builds in UTC and Jekyll silently DROPS any post
# whose date is still in the future there — a post dated today, built at 23:30 CEST
# (= 21:30 UTC the same day) is fine, but anything written after midnight local time
# vanishes from the build until UTC catches up. The workflow still reports success, the
# assets still deploy, and only the post 404s. Keep this set.
timezone: Europe/Berlin

# SEO plugins — both ship with the `github-pages` gem, so no Gemfile change needed.
# jekyll-sitemap → /sitemap.xml · jekyll-feed → /feed.xml
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Search-engine ownership verification. Paste the token from the provider's
# "HTML tag" verification method (just the content value, not the whole tag),
# then submit https://chart-horizon.com/sitemap.xml inside their console.
#   Google Search Console → https://search.google.com/search-console
#   Bing Webmaster Tools  → https://www.bing.com/webmasters
google_site_verification: "2CJ61hpNB-e-4qrgSS79xAPnwaOq4N-iFPaDpQmga5s"
# Bing is verified and crawling ALREADY — the property was imported from Google Search
# Console (Bing WMT → "Import from Google Search Console"), which carries the ownership
# proof across and needs no tag of its own. Leave this empty; adding a token buys nothing.
# Verified 2026-08-15: Bing reported 14 URLs indexed, 0 errors, 0 excluded.
bing_site_verification: ""

# Pretty, date-based URLs for posts only. A top-level `permalink:` would also rewrite
# pages (index, impressum, privacy) and break their .html paths — so scope it to posts.
defaults:
  - scope: { path: "", type: posts }
    values: { permalink: /:year/:month/:day/:title/ }

# Jekyll skips leading-underscore names, but Cloudflare Pages reads its redirect rules
# from a file called exactly `_redirects` at the build root — so it has to be forced back in.
include:
  - _redirects

# Files that live in the repo but must not be published as-is.
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - docs/
