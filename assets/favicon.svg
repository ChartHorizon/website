<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The masthead mark, cut for a 16px tab: ink ground, foil-gold sun on a paper horizon.
       Flat by system rule — no gradients (see DESIGN.md, The Flat-Sheet Rule). The arc is
       filled rather than stroked and the rays are heavy, because a 2.6px hairline at this
       size renders as nothing. -->
  <rect width="100" height="100" rx="22" fill="#17150f"/>
  <g fill="none" stroke="#c8a24a" stroke-width="7" stroke-linecap="round">
    <path d="M50 20v13"/>
    <path d="M24.5 40.5l7.5 7.5"/>
    <path d="M75.5 40.5L68 48"/>
  </g>
  <path d="M30 65a20 20 0 0 1 40 0z" fill="#c8a24a"/>
  <path d="M16 65h68" fill="none" stroke="#f5f4f1" stroke-width="5.5" stroke-linecap="round"/>
</svg>
