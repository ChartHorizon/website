# Videos for the cover's "On video" rail block, newest first. Only the first entry is
# rendered; the rest are history, kept so the newest is always the top line rather than
# something to hunt for.
#
# Hand-maintained on purpose: the upload pipeline (content/livermore/video/upload.py in
# the monorepo) records no video ids anywhere, so there is nothing to read automatically.
# Adding a video is this file plus one image.
#
# THE IMAGE: copy the YouTube thumbnail ONCE into assets/video/<id>.webp and commit it —
# the template derives that path from the id, so nothing here points at it. Never link
# i.ytimg.com instead. The cover makes zero third-party requests, privacy.html is written
# on the assumption that holds, and a remote thumbnail would quietly break both.
#
#   curl -sfL -o /tmp/yt.jpg "https://i.ytimg.com/vi/<id>/maxresdefault.jpg"
#   python3 -c "from PIL import Image; Image.open('/tmp/yt.jpg').convert('RGB').save('assets/video/<id>.webp','WEBP',quality=82,method=6)"

