# Resources for /resources/ (resources.html). Grouped into sections so a future
# section — reading, data sources, tools — is a block here and no template change.
#
# Per item:
#   title   headline, WITHOUT the series prefix (that belongs in `source`)
#   url     the plain watch/permalink URL. No &list=/&index= params: they pin the link
#           to one playlist position, which shifts when the uploader reorders the run.
#           Link the series once, in the section `note`, if it is worth having.
#   source  where it comes from — shown as dateline furniture, so keep it short
#   signal  OPTIONAL. Which of the desk's own lights the piece speaks to
#           (Season · Positioning · Hedging program · Term structure · Rate bias),
#           so outside material lands somewhere in the method rather than in a heap.
#           Leave it off when nothing fits — the template just drops the label.
#   byline  OPTIONAL. The author, for anything that has one. Books do; videos do not.
#   topics  OPTIONAL. What to take from it. OMIT when the only topic would restate
#           the title; a bullet that repeats the headline above it reads as a bug.
#
# PAID LINKS. A section may carry `affiliate: true`, which marks EVERY item in it:
# the template prints a visible "Affiliate link" chip on each entry and switches the
# link to rel="sponsored nofollow noopener". Both halves are obligations, not styling —
# the chip is § 5a Abs. 4 UWG (the commercial purpose has to be recognisable AT the link,
# not only in a note further up), and `sponsored` is Google's requirement for paid links;
# without it a paid link is an undisclosed one and the site risks a manual action.
# Such a section MUST also carry the Amazon Associates sentence verbatim in its `note`:
# "As an Amazon Associate I earn from qualifying purchases." That wording is prescribed
# by the Operating Agreement — do not paraphrase it.
#
# CHECK THE TAG BEFORE ADDING AN AMAZON LINK. Resolve the amzn.to short link and read the
# `tag=` parameter out of the destination:
#     curl -sSI https://amzn.to/<id> | grep -io 'tag=[^&]*'
# It has to be this desk's Associates tag (charthorizon-20). A link copied from someone
# else's page keeps THEIR tag and pays THEM — see the commented-out entry below, which
# arrived that way on 2026-09-06.
#
# NOTHING HERE IS THE DESK'S OWN WORK and none of it is an endorsement — the page says
# so once, in print, at the top. Keep that line if you add to this file.

