    - title: "Premium vs. Carrying Charge Market"
      url: https://www.youtube.com/watch?v=WsolkBzpDOQ
      source: "ICT Mentorship Core Content, Month 10"
      signal: Term structure
      topics:
        - Premium markets against carrying-charge markets
